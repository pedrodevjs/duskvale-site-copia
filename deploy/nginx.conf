# Container do site, gerenciado por systemd; o proxy público termina HTTPS.
server {
    listen 8080;
    server_name _;
    root /var/www/duskvale-site/dist;
    index index.html;
    # Monte /run/duskvale-lojas no contêiner; a API lê os cadastros do Survival.
    location = /api/lojas {
        proxy_pass http://unix:/run/duskvale-lojas/api.sock:;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
